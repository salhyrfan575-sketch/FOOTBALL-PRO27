name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot
        run: |
          V=4.4.1
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${V}-stable_linux.x86_64
          sudo mv godot-bin/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Prepare debug signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Configure Godot Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Run headless gameplay smoke tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee smoke-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid get index|Node not found|ERROR:' smoke-test.log; then
            echo "Godot smoke test emitted runtime errors"
            exit 1
          fi
      - name: Verify Android export templates
        run: |
          ls -lh ~/.local/share/godot/export_templates/4.4.1.stable/
          test -s ~/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          test -s ~/.local/share/godot/export_templates/4.4.1.stable/android_release.apk
      - name: Export signed APK
        timeout-minutes: 10
        run: |
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/FootballPro27.apk
          test -s build/FootballPro27.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/FootballPro27.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FootballPro27-Android-APK
          path: build/FootballPro27.apk
          if-no-files-found: error
